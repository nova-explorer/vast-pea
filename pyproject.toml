[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "vast_pea"
version = "0.0.1"
authors = [
  { name="Olivier Couture", email="olivier.couture@list.lu" },
]
description = "A collection of scripts, tools and utilities for the atomistic simulation of vitrimers"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = ["numpy","xarray"]

[project.urls]
Homepage = "https://github.com/nova-explorer/vast-pea"